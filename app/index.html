<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root {
    --bg: #f4f5f8; --card: #ffffff; --ink: #12151c; --muted: #636b7a; --line: #e3e6ec;
    --accent: #2f6bff; --good: #1a9a5b; --warn: #c27a00; --bad: #d23c3c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0d12; --card: #161a22; --ink: #eef1f6; --muted: #98a1b3; --line: #262c38;
            --accent: #6b95ff; --good: #3ccf86; --warn: #f0b23c; --bad: #ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
         padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  main { max-width: 640px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: flex-end; margin: 8px 2px 16px; }
  h1 { font-size: 30px; letter-spacing: -0.02em; margin: 0; }
  .sub { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  .brief p { margin: 0 0 8px; font-size: 17px; }
  .brief p:last-child { margin: 0; font-weight: 600; color: var(--accent); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: var(--bg); border-radius: 12px; padding: 10px; }
  .tile b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .tile span { font-size: 12px; color: var(--muted); }
  ol, ul { margin: 0; padding-left: 20px; }
  li { margin-bottom: 8px; }
  li small { display: block; color: var(--muted); }
  .row { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .time { width: 96px; flex: none; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--bg); color: var(--muted); margin-left: 6px; }
  .tag.prep { color: var(--warn); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
  .online { background: var(--good); } .empty { background: var(--warn); } .offline { background: var(--bad); }
  .src { font-size: 14px; padding: 4px 0; } .src small { color: var(--muted); display: block; margin-left: 16px; }
  button, input { font: inherit; border-radius: 12px; border: 1px solid var(--line); padding: 12px 14px; width: 100%; }
  input { background: var(--card); color: var(--ink); margin-bottom: 10px; }
  button { background: var(--accent); color: #fff; border: 0; font-weight: 600; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); margin-top: 8px; }
  audio { width: 100%; margin-top: 12px; }
  textarea { width: 100%; height: 120px; font: 12px ui-monospace, monospace; border-radius: 12px; padding: 8px;
             background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
  .hidden { display: none; }
  .err { color: var(--bad); font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <div><div class="sub" id="date">Morning brief</div><h1>Jarvis</h1></div>
    <div class="sub" id="updated"></div>
  </header>

  <section id="lock" class="card hidden">
    <h2>Unlock</h2>
    <p class="sub">Enter your brief passphrase. It stays on this phone.</p>
    <input id="pass" type="password" autocomplete="current-password" placeholder="Passphrase">
    <button id="unlock">Unlock</button>
    <p id="lockErr" class="err"></p>
  </section>

  <div id="content" class="hidden">
    <section class="card brief"><h2>Today</h2><div id="brief"></div><audio id="audio" controls class="hidden"></audio></section>
    <section class="card"><h2>At a glance</h2><div class="tiles" id="tiles"></div></section>
    <section class="card"><h2>Top 3</h2><ol id="top3"></ol></section>
    <section class="card"><h2>Schedule</h2><div id="schedule"></div></section>
    <section class="card"><h2>Drafts waiting for you</h2><ul id="drafts"></ul></section>
    <section class="card" id="suspiciousCard"><h2>Suspicious</h2><ul id="suspicious"></ul></section>
    <section class="card"><h2>Sources</h2><div id="sources"></div></section>
    <section class="card">
      <h2>Settings</h2>
      <button id="notify">Turn on morning notifications</button>
      <div id="subBox" class="hidden">
        <p class="sub">Copy this and save it as the <b>PUSH_SUBSCRIPTIONS</b> secret in GitHub:</p>
        <textarea id="sub" readonly></textarea>
        <button class="ghost" id="copy">Copy</button>
      </div>
      <button class="ghost" id="forget">Forget passphrase on this phone</button>
    </section>
  </div>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
